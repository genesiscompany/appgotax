openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: SaaS Multi-Empresas API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: empresas
    description: Gerenciamento de empresas (tenants)
  - name: usuarios
    description: Gerenciamento de usuários
  - name: motorista
    description: Módulo Motorista de App
  - name: ecommerce
    description: Módulo E-commerce
  - name: servicos
    description: Módulo Serviços
  - name: passagens
    description: Módulo Passagens
  - name: entrega
    description: Módulo Entrega
  - name: food
    description: Módulo Food
  - name: payments
    description: Mercado Pago and wallet beta payments

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login do usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login bem-sucedido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Registro de novo usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Usuário criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"

  /empresas:
    get:
      operationId: listEmpresas
      tags: [empresas]
      summary: Listar empresas
      responses:
        "200":
          description: Lista de empresas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Empresa"
    post:
      operationId: createEmpresa
      tags: [empresas]
      summary: Criar empresa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmpresaRequest"
      responses:
        "201":
          description: Empresa criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Empresa"

  /empresas/{id}:
    get:
      operationId: getEmpresa
      tags: [empresas]
      summary: Obter empresa por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Empresa encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Empresa"

  /usuarios:
    get:
      operationId: listUsuarios
      tags: [usuarios]
      summary: Listar usuários da empresa
      responses:
        "200":
          description: Lista de usuários
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Usuario"

  /modulos:
    get:
      operationId: listModulos
      tags: [empresas]
      summary: Listar módulos disponíveis/ativos da empresa
      responses:
        "200":
          description: Lista de módulos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Modulo"

  /motorista/corridas:
    get:
      operationId: listCorridas
      tags: [motorista]
      summary: Listar corridas
      responses:
        "200":
          description: Lista de corridas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Corrida"
    post:
      operationId: createCorrida
      tags: [motorista]
      summary: Criar corrida
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCorridaRequest"
      responses:
        "201":
          description: Corrida criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Corrida"

  /ecommerce/produtos:
    get:
      operationId: listProdutos
      tags: [ecommerce]
      summary: Listar produtos
      responses:
        "200":
          description: Lista de produtos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Produto"
    post:
      operationId: createProduto
      tags: [ecommerce]
      summary: Criar produto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProdutoRequest"
      responses:
        "201":
          description: Produto criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Produto"

  /ecommerce/pedidos:
    get:
      operationId: listPedidos
      tags: [ecommerce]
      summary: Listar pedidos
      responses:
        "200":
          description: Lista de pedidos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pedido"

  /servicos/categorias:
    get:
      operationId: listCategoriasServicos
      tags: [servicos]
      summary: Listar categorias de serviços
      responses:
        "200":
          description: Lista de categorias
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoriaServico"

  /servicos/agendamentos:
    get:
      operationId: listAgendamentos
      tags: [servicos]
      summary: Listar agendamentos
      responses:
        "200":
          description: Lista de agendamentos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agendamento"
    post:
      operationId: createAgendamento
      tags: [servicos]
      summary: Criar agendamento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgendamentoRequest"
      responses:
        "201":
          description: Agendamento criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agendamento"

  /passagens/rotas:
    get:
      operationId: listRotas
      tags: [passagens]
      summary: Listar rotas disponíveis
      responses:
        "200":
          description: Lista de rotas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Rota"

  /passagens/reservas:
    get:
      operationId: listReservas
      tags: [passagens]
      summary: Listar reservas
      responses:
        "200":
          description: Lista de reservas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reserva"
    post:
      operationId: createReserva
      tags: [passagens]
      summary: Criar reserva
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReservaRequest"
      responses:
        "201":
          description: Reserva criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reserva"

  /entrega/entregas:
    get:
      operationId: listEntregas
      tags: [entrega]
      summary: Listar entregas
      responses:
        "200":
          description: Lista de entregas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Entrega"
    post:
      operationId: createEntrega
      tags: [entrega]
      summary: Criar entrega
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEntregaRequest"
      responses:
        "201":
          description: Entrega criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entrega"
  /public/entrega/solicitar:
    post:
      operationId: requestPublicDelivery
      tags: [entrega]
      summary: Solicita entrega com preço recalculado autoritativamente pelo servidor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicDeliveryInput"
      responses:
        "201": { description: Entrega criada e enviada ao dispatch }
        "401": { description: Token assinado obrigatório para pagamento pelo app }

  /food/restaurantes:
    get:
      operationId: listRestaurantes
      tags: [food]
      summary: Listar restaurantes
      responses:
        "200":
          description: Lista de restaurantes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Restaurante"

  /food/cardapio/{restauranteId}:
    get:
      operationId: getCardapio
      tags: [food]
      summary: Obter cardápio do restaurante
      parameters:
        - name: restauranteId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cardápio do restaurante
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ItemCardapio"

  /payments/options/{empresaId}:
    get:
      operationId: getPaymentOptions
      tags: [payments]
      parameters:
        - name: empresaId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Public receiving options (beta)
          content: { application/json: { schema: { $ref: "#/components/schemas/PaymentOptions" } } }
  /payments/partner-config:
    get:
      operationId: getPartnerPaymentConfig
      tags: [payments]
      responses: { "200": { description: Partner payment status without credentials } }
  /payments/partner-options:
    put:
      operationId: updatePartnerPaymentOptions
      tags: [payments]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PartnerPaymentOptionsInput" } } }
      responses: { "200": { description: Saved partner payment options } }
  /payments/admin/partner-config/{empresaId}:
    get:
      operationId: getAdminPartnerPaymentConfig
      tags: [payments]
      parameters:
        - name: empresaId
          in: path
          required: true
          schema: { type: integer }
      responses: { "200": { description: Partner payment options using the global Mercado Pago account } }
    put:
      operationId: updateAdminPartnerPaymentConfig
      tags: [payments]
      parameters:
        - name: empresaId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdminPartnerPaymentConfigInput" } } }
      responses: { "200": { description: Saved partner payment options } }
  /payments/admin/config:
    get:
      operationId: getGlobalMercadoPagoConfig
      tags: [payments]
      responses: { "200": { description: Global Mercado Pago configuration without Access Token } }
    put:
      operationId: updateGlobalMercadoPagoConfig
      tags: [payments]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/GlobalMercadoPagoConfigInput" } } }
      responses: { "200": { description: Saved global Mercado Pago configuration } }
  /payments/admin/fees:
    get:
      operationId: getPaymentFees
      tags: [payments]
      responses: { "200": { description: Payment fees } }
    put:
      operationId: updatePaymentFees
      tags: [payments]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PaymentFeesInput" } } }
      responses: { "200": { description: Saved fees } }
  /payments/wallet:
    get:
      operationId: getWallet
      tags: [payments]
      responses: { "200": { description: Wallet balance } }
  /payments/cards/config:
    get:
      operationId: getSavedCardConfig
      tags: [payments]
      summary: Mercado Pago SDK configuration for an authenticated customer
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Public SDK configuration
          content: { application/json: { schema: { $ref: "#/components/schemas/SavedCardConfig" } } }
  /payments/cards:
    get:
      operationId: getSavedCard
      tags: [payments]
      summary: Get the authenticated customer's saved card
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Masked saved card, or null when none is saved
          content: { application/json: { schema: { $ref: "#/components/schemas/SavedCardResponse" } } }
    post:
      operationId: saveCard
      tags: [payments]
      summary: Save an official Mercado Pago SDK one-use card token
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SavedCardInput" } } }
      responses:
        "201":
          description: Masked saved card
          content: { application/json: { schema: { $ref: "#/components/schemas/SavedCard" } } }
  /payments/cards/{cardId}:
    delete:
      operationId: deleteSavedCard
      tags: [payments]
      summary: Delete the authenticated customer's saved card
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: cardId, in: path, required: true, schema: { type: string, minLength: 1 } }
      responses:
        "204": { description: Card deleted }
        "404": { description: Card not found }
  /payments/wallet/ledger:
    get:
      operationId: getWalletLedger
      tags: [payments]
      responses: { "200": { description: Wallet ledger } }
  /payments/wallet/topup:
    post:
      operationId: createWalletTopup
      tags: [payments]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WalletTopupInput" } } }
      responses: { "201": { description: Pix charge created with copy-and-paste code and optional QR image } }
  /payments/wallet/topup/pending:
    get:
      operationId: getPendingWalletTopup
      tags: [payments]
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: "Latest pending Pix wallet recharge or null" } }
  /payments/checkout:
    post:
      operationId: createPaymentCheckout
      tags: [payments]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CheckoutInput" } } }
      responses:
        "201": { description: Payment staged; a rejected card attempt may also be reset with a fresh token }
        "400": { description: Invalid checkout request or card payment token }
        "403": { description: Service is not owned by the authenticated customer }
        "404": { description: Authoritative service amount not found }
        "409": { description: "Existing intent cannot be reset, saved card is missing, or service is not eligible" }
  /payments/services/{module}/{referenceId}/cancel:
    post:
      operationId: cancelCustomerService
      tags: [payments]
      summary: Cancela serviço pertencente ao cliente autenticado enquanto ainda cancelável
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: module, in: path, required: true, schema: { type: string, enum: [motorista, entrega] } }
        - { name: referenceId, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Serviço e atribuições cancelados }
        "404": { description: Serviço não encontrado para o cliente }
        "409": { description: Estado não cancelável }
  /payments/services/{module}/{referenceId}/status:
    get:
      operationId: getCustomerServicePaymentStatus
      tags: [payments]
      summary: Consulta pagamento e Pix sanitizado de serviço pertencente ao cliente
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: module, in: path, required: true, schema: { type: string, enum: [motorista, entrega] } }
        - { name: referenceId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Estado do pagamento
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServicePaymentStatus"
        "404": { description: Serviço não encontrado para o cliente }
        "502": { description: A consulta read-only da order ao Mercado Pago falhou ou retornou referência/valor incompatível }
  /payments/webhook/mercado-pago:
    post:
      operationId: mercadoPagoWebhook
      tags: [payments]
      responses: { "200": { description: Webhook received } }
  /payments/transactions/{id}:
    get:
      operationId: getPaymentTransaction
      tags: [payments]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: Transaction status } }
  /payments/partner-transactions:
    get:
      operationId: listPartnerPaymentTransactions
      tags: [payments]
      responses: { "200": { description: Partner payment transactions } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    PaymentOptions:
      type: object
      properties:
        empresaId: { type: integer }
        mercadoPago: { type: boolean }
        directPayment: { type: boolean }
        wallet: { type: boolean }
        beta: { type: boolean }
        sandbox: { type: boolean }
    PartnerPaymentOptionsInput:
      type: object
      properties:
        mercadoPagoEnabled: { type: boolean }
        directPaymentEnabled: { type: boolean }
      required: [mercadoPagoEnabled, directPaymentEnabled]
    AdminPartnerPaymentConfigInput:
      type: object
      properties:
        mercadoPagoEnabled: { type: boolean }
        directPaymentEnabled: { type: boolean }
    GlobalMercadoPagoConfigInput:
      type: object
      properties:
        publicKey: { type: string }
        accessToken: { type: string, writeOnly: true }
        enabled: { type: boolean }
      required: [publicKey, enabled]
    PaymentFeesInput:
      type: object
      properties:
        pix: { type: integer, description: Percentage in basis points }
        card: { type: integer, description: Percentage in basis points }
        wallet: { type: integer, description: Percentage in basis points }
      required: [pix, card, wallet]
    WalletTopupInput:
      type: object
      properties:
        amountCents: { type: integer, minimum: 100 }
      required: [amountCents]
    SavedCardConfig:
      type: object
      properties:
        publicKey: { type: string }
        sandbox: { type: boolean }
      required: [publicKey, sandbox]
    SavedCard:
      type: object
      properties:
        cardId: { type: string }
        lastFour: { type: string, pattern: '^\d{4}$' }
        paymentMethod: { type: string }
        brand: { type: string }
        expirationMonth: { type: integer, minimum: 1, maximum: 12 }
        expirationYear: { type: integer }
      required: [cardId, lastFour, paymentMethod, brand, expirationMonth, expirationYear]
    SavedCardResponse:
      type: object
      properties:
        card:
          oneOf:
            - $ref: "#/components/schemas/SavedCard"
            - type: "null"
      required: [card]
    SavedCardInput:
      type: object
      additionalProperties: false
      properties:
        cardToken:
          type: string
          minLength: 8
          writeOnly: true
          description: Opaque one-use token created by the official Mercado Pago SDK.
      required: [cardToken]
    CheckoutInput:
      type: object
      additionalProperties: false
      properties:
        module: { type: string }
        referenceId: { type: string }
        paymentSource: { type: string, enum: [mercado_pago, wallet, carteira], description: carteira is accepted as a legacy input alias and normalized to wallet }
        mercadoPagoMethod: { type: string, enum: [pix, card, wallet] }
        payerEmail: { type: string, format: email }
        paymentToken:
          type: string
          minLength: 8
          maxLength: 512
          writeOnly: true
          description: One-use token created client-side by the Mercado Pago SDK from the authenticated customer's saved card and CVV. Required when mercadoPagoMethod is card; never stored after payment creation.
      required: [module, referenceId, paymentSource, mercadoPagoMethod]
    ServicePaymentStatus:
      type: object
      properties:
        module: { type: string, enum: [motorista, entrega] }
        referenceId: { type: integer }
        paymentSource: { type: string, enum: [direto, mercado_pago, wallet] }
        paymentStatus: { type: string, enum: [direto, pendente, pago, rejeitado] }
        status: { type: string }
        method: { type: [string, "null"] }
        pix:
          type: [object, "null"]
          properties:
            qrCode: { type: [string, "null"] }
            qrCodeBase64: { type: [string, "null"] }
            ticketUrl: { type: [string, "null"] }
      required: [module, referenceId, paymentSource, paymentStatus, status, method, pix]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        senha:
          type: string
        empresaCodigo:
          type: string
      required:
        - email
        - senha

    RegisterRequest:
      type: object
      properties:
        nome:
          type: string
        email:
          type: string
          format: email
        senha:
          type: string
        telefone:
          type: string
        empresaId:
          type: integer
      required:
        - nome
        - email
        - senha

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        usuario:
          $ref: "#/components/schemas/Usuario"
        empresa:
          $ref: "#/components/schemas/Empresa"
      required:
        - token
        - usuario

    Empresa:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        codigo:
          type: string
        logo:
          type: string
          nullable: true
        corPrimaria:
          type: string
        plano:
          type: string
          enum: [basico, profissional, enterprise]
        modulosAtivos:
          type: array
          items:
            type: string
        ativo:
          type: boolean
        criadoEm:
          type: string
          format: date-time
      required:
        - id
        - nome
        - codigo
        - corPrimaria
        - plano
        - modulosAtivos
        - ativo
        - criadoEm

    CreateEmpresaRequest:
      type: object
      properties:
        nome:
          type: string
        codigo:
          type: string
        corPrimaria:
          type: string
        plano:
          type: string
          enum: [basico, profissional, enterprise]
        modulosAtivos:
          type: array
          items:
            type: string
      required:
        - nome
        - codigo
        - plano

    Usuario:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        email:
          type: string
        telefone:
          type: string
          nullable: true
        avatar:
          type: string
          nullable: true
        papel:
          type: string
          enum: [admin, operador, cliente, motorista, entregador]
        empresaId:
          type: integer
        ativo:
          type: boolean
        criadoEm:
          type: string
          format: date-time
      required:
        - id
        - nome
        - email
        - papel
        - empresaId
        - ativo
        - criadoEm

    Modulo:
      type: object
      properties:
        id:
          type: string
        nome:
          type: string
        descricao:
          type: string
        icone:
          type: string
        ativo:
          type: boolean
        cor:
          type: string
      required:
        - id
        - nome
        - descricao
        - icone
        - ativo
        - cor

    Corrida:
      type: object
      properties:
        id:
          type: integer
        passageiroNome:
          type: string
        origemEndereco:
          type: string
        destinoEndereco:
          type: string
        status:
