name: Build Android AAB (Google Play)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - production
          - preview
  push:
    branches:
      - main
    paths:
      - 'artifacts/saas-mobile/app.json'
      - 'artifacts/saas-mobile/eas.json'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

jobs:
  build:
    name: Build Android ${{ github.event.inputs.profile || 'preview' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    defaults:
      run:
        working-directory: artifacts/saas-mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Habilitar pnpm 10 via corepack
        working-directory: ${{ github.workspace }}
        run: |
          npm install -g corepack@latest
          corepack enable
          corepack prepare pnpm@10.26.1 --activate
          pnpm --version

      - name: Instalar dependências (pnpm workspace)
        working-directory: ${{ github.workspace }}
        env:
          NPM_CONFIG_NODE_LINKER: hoisted
          NPM_CONFIG_SHAMEFULLY_HOIST: 'true'
          NPM_CONFIG_PUBLIC_HOIST_PATTERN: '*'
          EAS_BUILD: 'true'
        run: pnpm install --no-frozen-lockfile

      - name: Install EAS CLI
        working-directory: ${{ github.workspace }}
        run: npm install -g eas-cli@16.4.0

      - name: Verificar versão e arquivos
        run: |
          echo "=== app.json ===" && node -e "const a=require('./app.json'); console.log('version:', a.expo.version, '| versionCode:', a.expo.android.versionCode)"
          echo "=== eas.json ===" && cat eas.json

      - name: Gerar google-services.json (push notifications)
        env:
          GOOGLE_SERVICES_JSON_CONTENT: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_CONTENT" ]; then
            # Fora do projeto: o arquivo está no .gitignore e não entraria no build local do EAS
            GS_FILE="$RUNNER_TEMP/google-services.json"
            printf '%s' "$GOOGLE_SERVICES_JSON_CONTENT" > "$GS_FILE"
            node -e "const j=require(process.argv[1]); const ok=(j.client||[]).some(c=>c.client_info?.android_client_info?.package_name==='br.gotaxi.app'); if(!ok){console.error('google-services.json não tem o app br.gotaxi.app'); process.exit(1)} console.log('google-services.json OK')" "$GS_FILE"
            echo "GOOGLE_SERVICES_JSON=$GS_FILE" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret GOOGLE_SERVICES_JSON não configurado — push notifications não vão funcionar no Android."
          fi

      - name: Build Android (local — sem consumir cota EAS)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_NO_VCS: '1'
          EXPO_PUBLIC_DOMAIN: 'gotaxi.com.br'
          EXPO_PUBLIC_GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}
        run: |
          eas build \
            --platform android \
            --profile ${{ github.event.inputs.profile || 'preview' }} \
            --local \
            --non-interactive \
            --output ./build-output.aab

      - name: Upload AAB como artefato
        uses: actions/upload-artifact@v4
        with:
          name: gotaxi-android-${{ github.event.inputs.profile || 'preview' }}-v${{ github.run_number }}
          path: artifacts/saas-mobile/build-output.aab
          retention-days: 30
          if-no-files-found: error

      - name: Criar GitHub Release com o AAB
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: ${{ github.workspace }}
        run: |
          TAG="android-${{ github.event.inputs.profile || 'preview' }}-build-${{ github.run_number }}"
          gh release create "$TAG" \
            artifacts/saas-mobile/build-output.aab \
            --title "GoTaxi Android ${{ github.event.inputs.profile || 'preview' }} #${{ github.run_number }}" \
            --notes "Build automático — Run #${{ github.run_number }}" \
            --repo ${{ github.repository }}
